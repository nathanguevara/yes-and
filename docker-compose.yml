version: '3.8'

services:
  # Ollama service for local LLM inference with GPU support
  ollama:
    build:
      context: .
      dockerfile: Dockerfile.ollama
    container_name: yes-and-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - yes-and-network
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Backend API service
  backend:
    image: yes-and-backend:uv-local
    container_name: yes-and-backend
    ports:
      - "8000:8000"
    environment:
      - MODEL_NAME=llama3.2:3b
      - OLLAMA_HOST=ollama:11434
      - HOST=0.0.0.0
      - PORT=8000
      - LOG_LEVEL=INFO
      - TEMPERATURE=0.9
      - TOP_P=0.9
      - MAX_TOKENS=150
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    networks:
      - yes-and-network
    restart: unless-stopped
    depends_on:
      - ollama

networks:
  yes-and-network:
    driver: bridge

volumes:
  logs:
  data:
  ollama-models: